<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Manager</title>
    
    <!-- PWA & Favicon Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
    
    <!-- CSS Stylesheets (Relative paths fixed for GitHub Pages) -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/forms.css">
    <link rel="stylesheet" href="./css/tables.css">
    <link rel="stylesheet" href="./css/calendar.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="currency-symbol">¥</span>
            <h1>FinanceManager</h1>
        </div>
        <ul class="nav-links">
            <li><a href="#dashboard" class="active">Dashboard</a></li>
            <li><a href="#salary">Salary</a></li>
            <li><a href="#calendar">Calendar</a></li>
            <li><a href="#expenses">Expenses</a></li>
            <li><a href="#savings">Savings</a></li>
            <li><a href="#loans">Loans</a></li>
            <li><a href="#budget">Budget</a></li>
            <li><a href="#goals">Goals</a></li>
            <li><a href="#transactions">Transactions</a></li>
            <li><a href="#reports">Reports</a></li>
            <li><a href="#contacts">Contacts</a></li>
            <li><a href="#settings">Settings</a></li>
        </ul>
    </nav>

    <!-- Header / Top Banner -->
    <header class="top-header">
        <div class="privacy-badge">
            <span class="star-icon">✦</span>
            <p><strong>Private by design</strong> Your data stays in this browser.</p>
        </div>
        <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
    </header>

    <!-- Main App Content -->
    <main class="main-content">
        <section class="overview-section">
            <span class="sub-title">Overview</span>
            <h2>Dashboard</h2>
        </section>

        <!-- Quick Access Nav / Filter Pills -->
        <div class="quick-nav">
            <button class="pill-btn icon-btn" aria-label="Theme Toggle">🌙</button>
            <button class="pill-btn icon-btn" aria-label="Search">🔍</button>
            <button class="pill-btn brand-pill">FM</button>
            <button class="pill-btn active">Home</button>
            <button class="pill-btn">Expenses</button>
            <button class="pill-btn">Calendar</button>
            <button class="pill-btn">Goals</button>
            <button class="pill-btn">More</button>
        </div>

        <!-- Dashboard Views & Containers -->
        <div id="app-view">
            <!-- Dynamic UI elements will render here -->
        </div>
    </main>

    <!-- JavaScript Files (Loaded in correct dependency order) -->
    <script src="./js/storage.js"></script>
    <script src="./js/helpers.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/salary.js"></script>
    <script src="./js/expenses.js"></script>
    <script src="./js/savings.js"></script>
    <script src="./js/loans.js"></script>
    <script src="./js/goals.js"></script>
    <script src="./js/transactions.js"></script>
    <script src="./js/reports.js"></script>
    <script src="./js/calendar.js"></script>
    <script src="./js/settings.js"></script>
    <script src="./js/app.js"></script>

    <!-- Service Worker Registration for PWA support -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered successfully'))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
