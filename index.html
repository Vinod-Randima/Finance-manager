<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Premium personal finance manager">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <title>Finance Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">¥</div>
        <div><strong>Finance</strong><span>Manager</span></div>
      </div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard">⌂<span>Dashboard</span></button>
        <button class="nav-item" data-view="salary">◷<span>Salary</span></button>
        <button class="nav-item" data-view="calendar">▦<span>Calendar</span></button>
        <button class="nav-item" data-view="expenses">↘<span>Expenses</span></button>
        <button class="nav-item" data-view="savings">◈<span>Savings</span></button>
        <button class="nav-item" data-view="loans">↔<span>Loans</span></button>
        <button class="nav-item" data-view="budget">▤<span>Budget</span></button>
        <button class="nav-item" data-view="goals">◎<span>Goals</span></button>
        <button class="nav-item" data-view="transactions">⇄<span>Transactions</span></button>
        <button class="nav-item" data-view="reports">▥<span>Reports</span></button>
        <button class="nav-item" data-view="contacts">♙<span>Contacts</span></button>
        <button class="nav-item" data-view="settings">⚙<span>Settings</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="mini-tip"><span>✦</span><div><b>Private by design</b><small>Your data stays in this browser.</small></div></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
        <div class="topbar-title"><span class="eyebrow" id="viewEyebrow">Overview</span><h1 id="viewTitle">Dashboard</h1></div>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
          <button class="icon-btn" id="searchBtn" title="Search">⌕</button>
          <button class="avatar" id="settingsQuick">FM</button>
        </div>
      </header>

      <section class="content" id="app"></section>
    </main>
  </div>

  <div class="mobile-nav" id="mobileNav">
    <button class="nav-item active" data-view="dashboard">⌂<span>Home</span></button>
    <button class="nav-item" data-view="expenses">↘<span>Expenses</span></button>
    <button class="nav-item" data-view="calendar">▦<span>Calendar</span></button>
    <button class="nav-item" data-view="goals">◎<span>Goals</span></button>
    <button class="nav-item" data-view="settings">⚙<span>More</span></button>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/helpers.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/salary.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/savings.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
